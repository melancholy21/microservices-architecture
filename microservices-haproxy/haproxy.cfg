global
    log stdout format raw local0

defaults
    log     global
    mode    http
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

frontend http_front
    bind *:80
    
    # Define ACL paths to match routing rules
    acl url_audit       path_beg /api/v1/audit
    acl url_auth        path_beg /api/v1/users
    acl url_client      path_beg /api/v1/clients
    acl url_reservation path_beg /api/v1/reservations
    acl url_user        path_beg /api/v1/user-profiles

    # Dispatch traffic to target backend definitions
    use_backend audit_back       if url_audit
    use_backend auth_back        if url_auth
    use_backend client_back      if url_client
    use_backend reservation_back if url_reservation
    use_backend user_back        if url_user

backend audit_back
    server audit_srv auditlog-service:3005 check

backend auth_back
    server auth_srv auth-service:3006 check

backend client_back
    server client_srv client-service:3007 check

backend reservation_back
    server reservation_srv reservation-service:3009 check

backend user_back
    server user_srv user-service:3010 check

