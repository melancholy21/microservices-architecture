services:
  # ==========================================
  # DATABASE LAYER (microservices-db)
  # ==========================================
  auth_db:
    image: mongo:6.0
    container_name: auth_db
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - auth_data:/data/db
    networks:
      - cluster_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  reservation_db:
    image: mongo:6.0
    container_name: reservation_db
    ports:
      - "127.0.0.1:27018:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - reservation_data:/data/db
    networks:
      - cluster_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  client_db:
    image: mongo:6.0
    container_name: client_db
    ports:
      - "127.0.0.1:27019:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - client_data:/data/db
    networks:
      - cluster_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  user_db:
    image: mongo:6.0
    container_name: user_db
    ports:
      - "127.0.0.1:27020:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - user_data:/data/db
    networks:
      - cluster_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  audit_db:
    image: mongo:6.0
    container_name: audit_db
    ports:
      - "127.0.0.1:27021:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - audit_data:/data/db
    networks:
      - cluster_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # ==========================================
  # APPLICATION MESH LAYER (microservices-docker)
  # ==========================================
  audit-service:
    build: ./microservices-docker/auditlog-service
    container_name: auditlog-service
    environment:
      - PORT=3005
      - MONGO_URI=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@audit_db:27017/audit_db?authSource=admin
    depends_on:
      - audit_db
    networks:
      - cluster_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  auth-service:
    build: ./microservices-docker/authentication-service
    container_name: authentication-service
    environment:
      - PORT=3006
      - MONGO_URI=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@auth_db:27017/auth_db?authSource=admin
      - JWT_SECRET=${JWT_SECRET}
      - AUDIT_SERVICE_URL=http://auditlog-service:3005/api/v1/audit/logs
      - NOTIF_SERVICE_URL=http://notification-service:3008/api/v1/notifications/send-email
    depends_on:
      - auth_db
    networks:
      - cluster_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  client-service:
    build: ./microservices-docker/client-management-service
    container_name: client-management-service
    environment:
      - PORT=3007
      - MONGO_URI=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@client_db:27017/client_db?authSource=admin
      - AUDIT_SERVICE_URL=http://auditlog-service:3005/api/v1/audit/logs
    depends_on:
      - client_db
    networks:
      - cluster_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  notification-service:
    build: ./microservices-docker/notification-service
    container_name: notification-service
    environment:
      - PORT=3008
    networks:
      - cluster_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  reservation-service:
    build: ./microservices-docker/reservation-service
    container_name: reservation-service
    environment:
      - PORT=3009
      - MONGO_URI=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@reservation_db:27017/reservation_db?authSource=admin
      - JWT_SECRET=${JWT_SECRET}
      - AUDIT_SERVICE_URL=http://auditlog-service:3005/api/v1/audit/logs
      - NOTIF_SERVICE_URL=http://notification-service:3008/api/v1/notifications/send-email
    depends_on:
      - reservation_db
    networks:
      - cluster_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  user-service:
    build: ./microservices-docker/user-service
    container_name: user-service
    environment:
      - PORT=3010
      - MONGO_URI=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@user_db:27017/user_db?authSource=admin
      - JWT_SECRET=${JWT_SECRET}
      - AUDIT_SERVICE_URL=http://auditlog-service:3005/api/v1/audit/logs
    depends_on:
      - user_db
    networks:
      - cluster_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ==========================================
  # NETWORKING API GATEWAY LAYER
  # ==========================================
  gateway:
    build: ./microservices-haproxy
    container_name: api_gateway
    ports:
      - "80:80"
    depends_on:
      - audit-service
      - auth-service          
      - client-service        
      - reservation-service
      - user-service
      - notification-service
    networks:
      - cluster_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

networks:
  cluster_network:
    driver: bridge

volumes:
  auth_data:
  reservation_data:
  client_data:
  user_data:
  audit_data: